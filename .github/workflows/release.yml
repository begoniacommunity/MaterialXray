name: Release

on:
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.2" "cmake;3.31.6"

      - name: Validate release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
          LEGACY_STORE_PASSWORD: ${{ secrets.LEGACY_STORE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for secret_name in \
            RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD \
            LEGACY_KEYSTORE_BASE64 LEGACY_KEY_ALIAS LEGACY_KEY_PASSWORD LEGACY_STORE_PASSWORD \
            SENTRY_AUTH_TOKEN; do
            if [ -z "${!secret_name}" ]; then
              echo "$secret_name is not configured" >&2
              exit 1
            fi
          done

      - name: Decode release keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "$LEGACY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/legacy.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "LEGACY_KEYSTORE_PATH=$RUNNER_TEMP/legacy.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew --stacktrace app:assembleRelease

      - name: Prepare release APK artifacts
        id: artifact
        shell: bash
        env:
          LEGACY_KEYSTORE_PATH: ${{ env.LEGACY_KEYSTORE_PATH }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
          LEGACY_STORE_PASSWORD: ${{ secrets.LEGACY_STORE_PASSWORD }}
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "Failed to read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          apk_base="MaterialXray-v${version_name}-${short_sha}"
          apk_dir="app/build/outputs/apk/release/dist"
          mkdir -p "$apk_dir"

          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          sign_with_lineage() {
            "$apksigner" sign \
              --ks "$LEGACY_KEYSTORE_PATH" \
              --ks-key-alias "$LEGACY_KEY_ALIAS" \
              --ks-pass env:LEGACY_STORE_PASSWORD \
              --key-pass env:LEGACY_KEY_PASSWORD \
              --next-signer \
              --ks "$RELEASE_KEYSTORE_PATH" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_STORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --lineage config/signing/lineage.bin \
              --rotation-min-sdk-version 28 \
              --in "$1" \
              --out "$2"
          }

          sign_with_lineage \
            "app/build/outputs/apk/release/app-universal-release.apk" \
            "$apk_dir/${apk_base}.apk"
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            sign_with_lineage \
              "app/build/outputs/apk/release/app-${abi}-release.apk" \
              "$apk_dir/${apk_base}.${abi}.apk"
          done

          echo "apk_base=$apk_base" >> "$GITHUB_OUTPUT"
          echo "apk_dir=$apk_dir" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Prepare Xray corresponding source
        id: xray-source
        shell: bash
        run: |
          set -euo pipefail
          xray_version="$(< third_party/xray/VERSION)"
          source_name="Xray-core-${xray_version}-source.tar.gz"
          source_path="app/build/outputs/xray-source/${source_name}"
          ./scripts/prepare-xray-source.sh "$xray_version" "$source_path"
          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"
          echo "source_path=$source_path" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.artifact.outputs.apk_dir }}/*.apk
            ${{ steps.xray-source.outputs.source_path }}

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_base }}
          path: ${{ steps.artifact.outputs.apk_dir }}/*.apk
          if-no-files-found: error

      - name: Upload Xray corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.xray-source.outputs.source_name }}
          path: ${{ steps.xray-source.outputs.source_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.artifact.outputs.version_tag }}
          APK_DIR: ${{ steps.artifact.outputs.apk_dir }}
          XRAY_SOURCE_PATH: ${{ steps.xray-source.outputs.source_path }}
          XRAY_SOURCE_NAME: ${{ steps.xray-source.outputs.source_name }}
        run: |
          set -euo pipefail
          assets=("$APK_DIR"/*.apk "$XRAY_SOURCE_PATH#${XRAY_SOURCE_NAME}")
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${VERSION_TAG}:refs/tags/${VERSION_TAG}"
            tag_commit="$(git rev-list -n 1 "$VERSION_TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "$VERSION_TAG already points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$VERSION_TAG" "${assets[@]}" --clobber
          else
            gh release create "$VERSION_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$VERSION_TAG" \
              --generate-notes
          fi
