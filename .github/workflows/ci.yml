name: CI

on:
  # A pull request already builds its branch, so pushes only build master.
  push:
    branches: [master]
    paths-ignore: [website/**, .github/workflows/website.yml]
  pull_request:
    paths-ignore: [website/**, .github/workflows/website.yml]

permissions:
  contents: read

jobs:
  debug-build:
    name: "CI: Debug build"
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"
          cache: gradle

      # The build compiles Xray for armeabi-v7a, which upstream publishes no Android build for.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.2" "cmake;3.31.6"

      - name: Build debug APK
        # Universal and per-ABI APK packaging share the Gradle heap.
        run: >-
          ./gradlew --stacktrace --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MaterialXray-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
